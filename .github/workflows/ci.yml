name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: npm ci
      - run: uv sync --project backend --locked
      - run: npm run lint
      - run: uv run --project backend --locked ruff check .
      - run: uv run --project backend --locked ruff format --check .
      - run: uv run --project backend --locked pytest
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
